<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片暗号及 JSON 生成工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        textarea::-webkit-scrollbar { height: 8px; width: 8px; }
        textarea::-webkit-scrollbar-track { background: #f3f4f6; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <!-- 头部标题 -->
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">数据及 JSON 封装工具</h1>
          
        </div>

        <!-- 制作信息区域 -->
        <div class="p-6">
            <div class="space-y-6">
                <!-- 数据输入区 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">请输入要隐藏封装的信息 (留空则生代表关闭）</label>
                    <textarea id="x_input" rows="3" placeholder="例如: 1@@https://您的落地页.com@@1@@1@@1@@#d0664e@@line.me" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none"></textarea>
                </div>

                <!-- 按钮操作区 -->
                <div class="grid grid-cols-2 gap-4 mt-2">
                    <button id="btn_dl" hidden="true" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 rounded-lg transition duration-200 border border-gray-300">
                        ⬇️ 仅下载图片
                    </button>
                    <button id="btn_build" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-3 rounded-lg transition duration-200 border border-blue-200">
                        📄 生成 JSON 数据
                    </button>
                </div>

                <!-- JSON 输出展示区 -->
                <div class="mt-4 pt-4 border-t border-gray-200">
                    <label class="block text-sm font-medium text-gray-700 mb-2 flex justify-between items-center">
                        <span>生成的 JSON 结果：</span>
                        <button id="btn_cp" class="text-xs bg-gray-800 text-white px-3 py-1.5 rounded hover:bg-gray-700 transition shadow-sm">📋 一键复制</button>
                    </label>
                    <textarea id="x_output" rows="6" readonly class="w-full bg-gray-900 border border-gray-700 rounded-lg p-4 text-green-400 outline-none resize-none font-mono text-sm break-all shadow-inner" placeholder='{"lunchimage": "点击上方【生成 JSON 数据】后在此处显示..."}'></textarea>
                </div>
                
                <div id="x_msg" class="mt-4 text-sm text-center hidden"></div>
            </div>
        </div>
    </div>

    <!-- 加密后的核心逻辑代码 -->
    <script>
        !function(){var e=document,t=window,n=function(t,n){var r=e.getElementById("x_msg");r.textContent=n,r.className="mt-4 text-sm text-center font-medium "+(t?"text-red-600":"text-green-600")+" block",setTimeout((function(){r.classList.add("hidden")}),3500)},r=function(){var t=e.createElement("canvas");t.width=1,t.height=1;var n=t.getContext("2d");return n.fillStyle="#ffffff",n.fillRect(0,0,1,1),t.toDataURL("image/jpeg",1)},a=function(){var t=e.getElementById("x_input").value.trim(),n=r();if(!t)return n;try{var a={};return a[piexif.ImageIFD.ImageDescription]=btoa(unescape(encodeURIComponent(t))),piexif.insert(piexif.dump({"0th":a}),n)}catch(e){throw new Error("\u5904\u7406\u5f02\u5e38")}};e.getElementById("btn_dl").onclick=function(){try{var t=a(),r=e.createElement("a");r.href=t,r.download="config_banner_"+(new Date).getTime()+".jpg",e.body.appendChild(r),r.click(),e.body.removeChild(r),n(!1,"\uD83C\uDF89 \u4E0B\u8F7D\u6210\u529F\uFF01")}catch(e){n(!0,e.message||"\u4E0B\u8F7D\u5931\u8D25")}},e.getElementById("btn_build").onclick=function(){try{var t=a();e.getElementById("x_output").value=JSON.stringify({lunchimage:t},null,2),n(!1,"\u2705 JSON \u6570\u636E\u5DF2\u6210\u529F\u751F\u6210\uFF01")}catch(t){n(!0,t.message||"\u751F\u6210\u5931\u8D25")}},e.getElementById("btn_cp").onclick=function(){var t=e.getElementById("x_output").value;t&&-1===t.indexOf("\u70B9\u51FB\u4E0A\u65B9")?navigator.clipboard.writeText(t).then((function(){n(!1,"\uD83D\uDCCB \u5DF2\u590D\u5236\u5230\u526A\u8D34\u677F\uFF01")})).catch((function(){n(!0,"\u590D\u5236\u5931\u8D25\uFF0C\u8BF7\u624B\u52A8\u590D\u5236")})):n(!0,"\u8BF7\u5148\u751F\u6210\u6570\u636E")}}();
    </script>
</body>
</html>
